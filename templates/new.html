{% extends "_base.html" %}

{% block title %}
New
{% endblock %}

{% block content %}

<h2>Novo conteúdo</h2>

<form method="post">

    <div class="mb-3">
        <label for="title" class="form-label">Título</label>

        <input
            type="text"
            id="title"
            name="title"
            class="form-control"
        >
    </div>

    <div class="mb-3">
        <label for="text" class="form-label">Texto</label>

        <textarea
            id="text"
            name="text"
            class="form-control"
            rows="5"
        ></textarea>
    </div>

    <button type="submit" class="btn btn-primary">
        Salvar
    </button>

</form>

{% endblock %}
